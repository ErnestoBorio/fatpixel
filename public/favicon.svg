<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242632"/>
      <stop offset="100%" stop-color="#14151c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Plate -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#36394c" stroke-width="1"/>

  <!-- Subtle Pixel Grid Canvas Area -->
  <g opacity="0.18">
    <rect x="5" y="5" width="22" height="22" fill="#2d3042" rx="1"/>
    <path d="M5 10.5h22 M5 16h22 M5 21.5h22 M10.5 5v22 M16 5v22 M21.5 5v22" stroke="#505670" stroke-width="0.5"/>
  </g>

  <!-- Pixel Art 'P' Glyph -->
  <!-- Stem -->
  <rect x="6" y="6" width="4" height="4" fill="#00d2ff" rx="0.5"/>
  <rect x="6" y="10.5" width="4" height="4" fill="#00b4e6" rx="0.5"/>
  <rect x="6" y="15" width="4" height="4" fill="#0096cc" rx="0.5"/>
  <rect x="6" y="19.5" width="4" height="4" fill="#0078b0" rx="0.5"/>
  <rect x="6" y="24" width="4" height="4" fill="#005d90" rx="0.5"/>

  <!-- Top Bar -->
  <rect x="10.5" y="6" width="4" height="4" fill="#38bdf8" rx="0.5"/>
  <rect x="15" y="6" width="4" height="4" fill="#818cf8" rx="0.5"/>

  <!-- Right Loop -->
  <rect x="19.5" y="6" width="4" height="4" fill="#a78bfa" rx="0.5"/>
  <rect x="19.5" y="10.5" width="4" height="4" fill="#c084fc" rx="0.5"/>
  <rect x="19.5" y="15" width="4" height="4" fill="#e879f9" rx="0.5"/>

  <!-- Loop Bottom -->
  <rect x="15" y="15" width="4" height="4" fill="#f43f5e" rx="0.5"/>
  <rect x="10.5" y="15" width="4" height="4" fill="#fb7185" rx="0.5"/>

  <!-- Active Pixel Art Spark / Accent Pixel -->
  <rect x="17" y="21.5" width="5" height="5" fill="#fbbf24" rx="0.8" filter="url(#glow)"/>
  <rect x="23" y="19.5" width="3" height="3" fill="#fef08a" rx="0.5"/>
</svg>
