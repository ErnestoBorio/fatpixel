<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Fatpixel - Pixel art editor</title>
    <meta name="title" content="Fatpixel - Pixel art editor" />
    <meta name="description" content="Web-based pixel art editor for old school graphics. Edit sprites and charsets with different palettes, bpp and pixel aspect ratios. Import and export to raw data and .png" />
    <meta name="author" content="Drean64" />
    <meta name="keywords" content="pixel art, retro pixel art, sprite editor, charset editor, c64 sprites, vga, 2:1 aspect ratio, nes, game boy, fat pixel, fatpixel" />
    <meta name="robots" content="index, follow" />

    <!-- Color Scheme & Theme -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1e1e24" />

    <!-- Open Graph / Facebook / Discord / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fatpixel" />
    <meta property="og:title" content="Fatpixel - Pixel art editor" />
    <meta property="og:description" content="Web-based pixel art editor for old school graphics. Edit sprites and charsets with different palettes, bpp and pixel aspect ratios. Import and export to raw data and .png" />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Fatpixel - Pixel art editor" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fatpixel - Pixel art editor" />
    <meta name="twitter:description" content="Web-based pixel art editor for old school graphics. Edit sprites and charsets with different palettes, bpp and pixel aspect ratios. Import and export to raw data and .png" />
    <meta name="twitter:image" content="./og-image.png" />
    <meta name="twitter:image:alt" content="Fatpixel - Pixel art editor" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- iOS Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fatpixel" />
    <style>
      :root {
        --color-bg-base: #141416;
        --color-bg-surface: #1e1e24;
        --color-bg-subtle: #26262e;
        --color-border: rgba(255, 255, 255, 0.08);
        --color-border-hover: rgba(255, 255, 255, 0.16);
        --color-accent: #0a84ff;
        --color-text-primary: #f5f5f7;
        --color-text-secondary: #a1a1a6;
        --color-text-muted: #6e6e73;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--color-bg-base);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* macOS Sleek Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
